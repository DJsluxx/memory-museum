name: Fetch Album and Build Museum

# Triggered manually from mobile GitHub → Actions → "Fetch Album and Build Museum" → Run workflow
#
# Why this exists: Claude Code's sandbox can't reach Google Photos (hard-blocked
# at the network proxy). GitHub's runners CAN, so we run the whole
# fetch → process → build pipeline here and commit the results back.

on:
  workflow_dispatch:
    inputs:
      album_url:
        description: 'Google Photos shared album URL (e.g. https://photos.app.goo.gl/xxxxx)'
        required: true
        default: 'https://photos.app.goo.gl/RHDkpM7ZZsc5zyGw5'
      max_photos:
        description: 'Max number of photos to fetch (0 = all; default 100)'
        required: false
        default: '100'
      size:
        description: 'Requested photo size (longest edge in px)'
        required: false
        default: '2048'
      concurrency:
        description: 'Parallel download count'
        required: false
        default: '6'

permissions:
  contents: write

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Install three.js (for bundling)
        run: npm install three@0.161.0

      - name: Fetch photos from album
        run: |
          python3 fetch_all_photos.py \
            "${{ github.event.inputs.album_url }}" \
            --size "${{ github.event.inputs.size }}" \
            --concurrency "${{ github.event.inputs.concurrency }}" \
            --max-photos "${{ github.event.inputs.max_photos }}" \
            --max-minutes 25

      - name: Show fetch result
        run: |
          echo "Raw photos:"
          ls -la photos/raw/ 2>/dev/null | head -30 || true
          echo "Total count: $(ls photos/raw/*.jp*g 2>/dev/null | wc -l)"

      - name: Process photos (EXIF → country, chronological sort)
        run: python3 process_photos.py

      - name: Show country distribution
        run: |
          python3 -c "
          import json
          m = json.load(open('photo-manifest.json'))
          from collections import Counter
          c = Counter(p['country'] for p in m)
          print(f'Total: {len(m)} photos')
          for country, count in c.most_common():
              print(f'  {country:20s} {count:>4}')
          " || true

      - name: Re-embed exhibits into index-source.html (generated from manifest)
        run: python3 build.py

      - name: Verify build output
        run: |
          ls -la index.html
          du -h index.html
          # Fail if the build didn't produce a reasonable file
          [ -s index.html ] || exit 1

      - name: Commit the fetched photos + rebuilt museum
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Photos/raw can be large — keep it out of the repo. Processed
          # photos/*.jpg + manifest + shipped index.html are what matter.
          git add photos/ photo-manifest.json index.html index-source.html fetched-photo-urls.txt || true
          # Skip commit if nothing actually changed (idempotent re-runs)
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            COUNT=$(python3 -c "import json; print(len(json.load(open('photo-manifest.json'))))" 2>/dev/null || echo '?')
            git commit -m "Fetched $COUNT photos from Google Photos + rebuilt museum

          Auto-generated by .github/workflows/fetch-album.yml running
          fetch_all_photos.py → process_photos.py → build.py on a GitHub runner
          (sandbox can't reach Google Photos directly)."
            git push
          fi

      - name: Upload screenshots/debug on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-debug
          path: |
            fetch-debug-*.png
            process-errors.log
          retention-days: 7
          if-no-files-found: ignore
